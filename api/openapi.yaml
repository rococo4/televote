openapi: 3.1.1
info:
  title: Televote
  version: 0.3.0
paths:
  /api/polls/{id}:
    get:
      operationId: getPublicPoll
      summary: Получить вопрос и варианты ответа
      description: До закрытия опроса сервер также выдаёт браузеру cookie для голосования.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Опубликованный опрос.
          headers:
            Set-Cookie:
              description: Анонимная cookie televote_voter для этого опроса.
              schema: {type: string}
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicPoll'}
        '307': {$ref: '#/components/responses/CanonicalPollURL'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Некорректный ID опроса.
        '404': {$ref: '#/components/responses/PollNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/polls/{id}/votes:
    post:
      operationId: submitVote
      summary: Анонимно отправить бюллетень
      description: Пока опрос открыт, можно заменить свой ответ, отправив новый набор вариантов.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор опроса.
          schema:
            type: string
            format: uuid
        - name: televote_voter
          in: cookie
          required: true
          description: Cookie, полученная при открытии опроса.
          schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choices]
              properties:
                choices:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: integer
                  description: Полный список ID выбранных вариантов ответа.
            example:
              choices: [2]
      responses:
        '202':
          description: Бюллетень принят в обработку.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
              example: {status: accepted}
        '307': {$ref: '#/components/responses/CanonicalPollURL'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/PollNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/polls:
    post:
      operationId: createPoll
      summary: Создать и опубликовать опрос
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePoll'}
            example:
              question: Какой вариант вам ближе?
              choices: [A, B]
              min_choices: 1
              max_choices: 1
              opens_at: '2027-01-15T17:00:00Z'
              closes_at: '2027-01-15T17:01:00Z'
      responses:
        '201':
          description: Опрос опубликован. Повтор с тем же ID и параметрами возвращает тот же ID.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Некорректный запрос или ID опроса занят другими параметрами.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/polls/{id}/results:
    get:
      operationId: getPollResults
      summary: Получить статус и обезличенный результат
      security: [{adminBearer: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Статус опроса. После подсчёта доступны итоги по вариантам.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PollReport'}
              example:
                id: '581fc419-006d-436d-9fc3-a8dd18744719'
                question: Какой вариант вам ближе?
                status: final
                ballots: 2
                choices: [{id: 1, label: A, votes: 0, percent: 0}, {id: 2, label: B, votes: 2, percent: 100}]
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Некорректный ID опроса.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/PollNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Токен администратора в заголовке Authorization.
  responses:
    CanonicalPollURL:
      description: Канонический адрес этого опроса.
      headers:
        Location:
          required: true
          schema: {type: string, format: uri-reference}
    BadRequest:
      description: Запрос отклонён. Поле message поясняет причину.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {code: {const: bad_request}}
    Unauthorized:
      description: Требуется действующий токен администратора.
      headers:
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: unauthorized, message: Требуется действующий токен администратора.}
    PollNotFound:
      description: Опрос не найден.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: poll_not_found, message: Опрос не найден.}
    InternalError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {code: {const: internal_error}}
          example: {code: internal_error, message: Внутренняя ошибка сервера.}
  schemas:
    PublicPoll:
      type: object
      additionalProperties: false
      required: [id, question, choices, min_choices, max_choices, opens_at, closes_at]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: {type: integer}
              label: {type: string}
        min_choices: {type: integer, minimum: 1}
        max_choices: {type: integer, minimum: 1}
        opens_at: {type: string, format: date-time}
        closes_at: {type: string, format: date-time}
    CreatePoll:
      type: object
      additionalProperties: false
      required: [question, choices, min_choices, max_choices, opens_at, closes_at]
      properties:
        id:
          type: string
          format: uuid
          description: Ненулевой UUID опроса. Если поле пропущено, сервис назначит ID.
        question: {type: string, minLength: 1}
        choices:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Названия вариантов в порядке показа. Без пробелов по краям они должны быть непустыми и уникальными.
        min_choices: {type: integer, minimum: 1}
        max_choices:
          type: integer
          minimum: 1
          description: Максимум выбранных вариантов, от min_choices до числа вариантов в опросе.
        opens_at: {type: string, format: date-time}
        closes_at:
          type: string
          format: date-time
          description: Время закрытия нового опроса должно быть в будущем и позже opens_at.
    PollReport:
      type: object
      description: Поля ballots, votes и percent появляются только в итоговом отчёте (status = final).
      additionalProperties: false
      required: [id, question, status, choices]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        status:
          type: string
          enum: [scheduled, open, finalizing, final]
        ballots:
          type: integer
          format: int64
          minimum: 0
          description: Число учтённых бюллетеней.
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: {type: integer}
              label: {type: string}
              votes: {type: integer, format: int64, minimum: 0}
              percent:
                type: [number, 'null']
                minimum: 0
                maximum: 100
                description: Процент бюллетеней с этим вариантом. Если бюллетеней нет, значение равно null.
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, minLength: 1, description: Пояснение для пользователя.}
